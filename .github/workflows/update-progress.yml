name: Update fundraising progress

on:
  schedule:
    - cron: "0 * * * *"   # every hour
  workflow_dispatch:       # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read totals from Kindful
        env:
          # Set this under Settings > Secrets and variables > Actions > Variables
          KINDFUL_URL: ${{ vars.KINDFUL_URL }}
        run: python scripts/update_progress.py
      - name: Save if changed
        run: |
          if ! git diff --quiet progress.json; then
            git config user.name "progress-bot"
            git config user.email "progress-bot@users.noreply.github.com"
            git add progress.json
            git commit -m "Update fundraising progress"
            git push
          fi
